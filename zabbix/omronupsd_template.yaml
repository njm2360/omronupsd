          triggers:
            - uuid: db23a6d4cb394a18bcaba16b61f7e37f
              expression: 'max(/omronupsd by Zabbix agent 2/omronupsd.ups.connected,2m)=0 and count(/omronupsd by Zabbix agent 2/omronupsd.ups.connected,2m)>=4'
              name: 'UPS: Communication lost'
